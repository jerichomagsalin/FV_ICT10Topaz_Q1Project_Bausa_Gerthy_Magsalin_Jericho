<body>
    <!-- recently learned this from w3 schools and added touches-->

    <!-- navbar part  -->

    <!-- current problem : you cannot float the list items to the right-->
    
    <nav class="nvhct">
        <ul class="nav container-fluid" style="float:right;">
            <li class="nav-item"><a class="nav-link text-white" href="index.html">Receipt Generator</a></li>
            <li class="nav-item"><a class="nav-link text-white"  href="page2.html">SKU Generator</a></li>
        </ul>
    </nav>

    <!-- navbar part -->

    <br>
    <br>
    <br>

    <!-- section 2-->

    <div class="container divformat">
        <h2 style="text-align:center;">SKU Generator</h2>
        <hr>
        <form>

            <label>Category</label>
            <br>

            <div class="d-grid">
            <select id="sample">
                <option value="0">Select here</option>
                <option value="1">Perishable</option>
                <option value="2">Non-Perishable (ai)</option>
                <option value="53">Long-Lasting</option>
            </select>
            </div>

            <br>
            <label>Product Name</label>
            <br>

            <div class="d-grid">
            <input type="text" id="productname">
            </div>

            <br>
            <label>Stock Quantity</label>
            <br>

            <div class="d-grid">
                <input type="text" id="quantity" inputmode="numeric" pattern="[0-9]*" placeholder="0">
            </div>

            <br>

            <div class="d-grid">
            <button id="generateSkuBtn" class="btn btn-primary" type="button">Generate SKU</button>
            </div>

            <br>

            <p style="text-align:center; font-size: 10px">Your Receipt will appear below the line once you press the [Generate SKU] button.</p>

            <hr>

            <h3 id="crsku" style="text-align:center; display:none" >SKU</h3>

            <div id="cr_sku_display" style="text-align:center; display:none; margin-top:8px; font-weight:600;"></div>

            <p></p>

        </form>
    </div>

    <script>
    // SKU generator
    document.getElementById('generateSkuBtn').addEventListener('click', function () {
        const sel = document.getElementById('sample');
        const product = document.getElementById('productname');
        const qtyEl = document.getElementById('quantity');
        const outHeader = document.getElementById('crsku');
        const out = document.getElementById('cr_sku_display');

        const categoryText = sel.options[sel.selectedIndex].text || '';
        const categoryCode = categoryText.split(/\s+/)[0].replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase() || 'GEN';
        const prodRaw = (product.value || '').trim();
        if (!prodRaw) {
            outHeader.style.display = 'block';
            out.style.display = 'block';
            out.innerText = 'Please enter a product name to generate SKU.';
            return;
        }

        const prodCode = prodRaw.replace(/[^A-Za-z0-9]/g,'').slice(0,4).toUpperCase() || 'PROD';
        let qty = Number(qtyEl.value || 0);
        if (!Number.isFinite(qty) || qty < 0) qty = 0;
        const qtyCode = String(Math.floor(qty)).padStart(3,'0');

        const sku = `${categoryCode}-${prodCode}-${qtyCode}`;

        outHeader.style.display = 'block';
        out.style.display = 'block';
        out.innerText = sku;
    });
    </script>

    <!-- form part start -->

</body>
